# Reuters / AP / WaPo / Bloomberg / Telegraph / WSJ have all either killed
# public RSS or WAF-block automated fetchers. We replace them with a single
# Google News RSS aggregator that captures coverage from all major outlets.
- id: gnews-clinical-trials
  name: Google News — clinical trials & FDA approvals (aggregator)
  source_type: newspaper
  rss_url: https://news.google.com/rss/search?q=%22clinical+trial%22+OR+%22FDA+approval%22+OR+%22EMA+approval%22+OR+%22phase+3%22+OR+%22phase+2%22&hl=en&gl=US&ceid=US:en
  paywalled: false
  extraction_strategy: jina_reader
  active: true

