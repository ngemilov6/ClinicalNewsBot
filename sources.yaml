# Source registry. Override `active: false` to disable a source without deletion.
# `bypass_filtering: true` skips the keyword/embedding/LLM gate — reserved for
# authoritative structured sources where every item is by definition relevant.

# ------------------------------------------------------------
# Authoritative structured sources (bypass filtering)
# ------------------------------------------------------------
- id: ctgov-recent
  name: ClinicalTrials.gov — Recently Updated
  source_type: registry
  api_url: https://clinicaltrials.gov/api/v2/studies
  extraction_strategy: api_native
  bypass_filtering: true
  active: true

- id: pubmed-trials
  name: PubMed — Clinical Trials & RCTs
  source_type: journal
  api_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  extraction_strategy: api_native
  bypass_filtering: true
  active: true

- id: fda-press
  name: FDA — Press Announcements
  source_type: regulator
  rss_url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
  extraction_strategy: jina_reader
  bypass_filtering: true
  active: true

- id: ema-news
  name: EMA — News
  source_type: regulator
  rss_url: https://www.ema.europa.eu/en/news.xml
  extraction_strategy: jina_reader
  bypass_filtering: true
  active: true

- id: retraction-watch
  name: Retraction Watch
  source_type: retraction
  rss_url: https://retractionwatch.com/feed/
  extraction_strategy: jina_reader
  bypass_filtering: true
  active: true

# ------------------------------------------------------------
# Industry / trade publications — go through the full filter chain.
# ------------------------------------------------------------
- id: clinical-trials-arena
  name: Clinical Trials Arena
  source_type: newspaper
  rss_url: https://www.clinicaltrialsarena.com/feed/
  paywalled: false
  extraction_strategy: jina_reader
  active: true

- id: endpoints-news
  name: Endpoints News
  source_type: newspaper
  rss_url: https://endpoints.news/feed/
  paywalled: true
  extraction_strategy: rss_snippet_only
  active: true

# Applied Clinical Trials Online: their WAF blocks programmatic feed access
# (403 on /feed, /rss, /?feed=rss2). Left disabled until a working ingest path
# is found — manual export or RSS via a third-party aggregator could work.
- id: applied-clinical-trials
  name: Applied Clinical Trials Online
  source_type: newspaper
  rss_url: https://www.appliedclinicaltrialsonline.com/feed
  paywalled: false
  extraction_strategy: jina_reader
  active: false

# Note: the FDA "clinical trials guidance documents" page
# (https://www.fda.gov/science-research/clinical-trials-and-human-subject-protection/
#  clinical-trials-guidance-documents) is a static reference index, not a news
# feed. Use the existing `fda-press` source above for FDA announcements.

