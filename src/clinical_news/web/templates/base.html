<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinical News Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Clinical News Bot</a>
    <nav>
      <a href="/library">Library</a>
      <a href="/search">Search</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <small>Automated weekly synthesis from registry, journal, regulator, and newspaper sources.</small>
  </footer>
</body>
</html>
