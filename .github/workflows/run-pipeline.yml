name: Run pipeline

# Triggers:
#   - "Generate new brief" button on the deployed UI fires repository_dispatch
#     with type=generate, which runs ingest then synthesize.
#   - workflow_dispatch lets you trigger from the Actions tab manually.
on:
  repository_dispatch:
    types: [generate]
  workflow_dispatch:
    inputs:
      stage:
        description: "What to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ingest
          - synthesize

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Required secrets — set in repo Settings → Secrets and variables → Actions
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Embedded-replica mode: pipeline writes against a local SQLite file
      # in the runner, then syncs the whole DB to Turso at exit. Avoids the
      # Hrana stream-not-found cascade that breaks long-running ingest.
      # Hardcoded — `${{ runner.temp }}` doesn't expand in job-level env.
      TURSO_EMBEDDED_PATH: /tmp/clinical-news.db
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GEMINI_MIN_INTERVAL_S: "5.0"
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Migrate DB
        run: clinical-news migrate

      - name: Ingest
        if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.stage != 'synthesize' }}
        run: clinical-news ingest

      - name: Synthesize
        if: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.stage != 'ingest' }}
        run: clinical-news synthesize
