[project]
name = "clinical-news"
version = "0.1.0"
description = "Automated clinical-trial news aggregator and weekly synthesizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "google-generativeai>=0.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
    "libsql-experimental>=0.0.49",
]

[project.optional-dependencies]
claude = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "responses>=0.25"]

[project.scripts]
clinical-news = "clinical_news.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
